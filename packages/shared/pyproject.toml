[project]
name = "nexova-shared"
version = "0.1.0"
description = "Logica de dominio Python compartida de Nexova: validacion del analizador de tickets y del gestor de incidencias."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nexova_shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
